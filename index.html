<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Анбани — карточки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;700&family=Noto+Sans+Georgian:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: одна колонка — шапка с XP, вкладки (буквы / числа / формы), юниты, карточка, кнопки оценки, «стена кирпичей», справка */
:root{
  --bg:#f6efe8; --surface:#fffaf5; --line:#e6d6c8; --fg:#2b1b17; --muted:#7d665d;
  --brick:#7b2d26; --brick-2:#a3473c; --on-brick:#fff6ef;
  --olive:#56692a; --olive-bg:#eef0dc;
  --clay:#e9d3c0; --clay-2:#d9ab8c; --clay-3:#c07a5c; --clinker:#7b2d26;
  --good:#3f7a4a; --bad:#b4442f;
  --shadow:0 1px 0 rgba(123,45,38,.06),0 12px 30px -14px rgba(123,45,38,.35);
  --f-geo:"Noto Serif Georgian","Noto Sans Georgian",serif;
  --f-geo-sans:"Noto Sans Georgian","Manrope",sans-serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1412; --surface:#271c19; --line:#3d2c27; --fg:#f3e6dd; --muted:#b39a8f;
  --brick:#d06a5c; --brick-2:#e2867a; --on-brick:#1c1412;
  --olive:#b3c777; --olive-bg:#2c2f1c;
  --clay:#3a2b26; --clay-2:#6a4636; --clay-3:#9b5a45; --clinker:#d06a5c;
  --good:#7cc08a; --bad:#e2786a; --shadow:0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1412; --surface:#271c19; --line:#3d2c27; --fg:#f3e6dd; --muted:#b39a8f;
  --brick:#d06a5c; --brick-2:#e2867a; --on-brick:#1c1412;
  --olive:#b3c777; --olive-bg:#2c2f1c;
  --clay:#3a2b26; --clay-2:#6a4636; --clay-3:#9b5a45; --clinker:#d06a5c;
  --good:#7cc08a; --bad:#e2786a; --shadow:0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
.ka{font-family:var(--f-geo-sans)}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--brick)}
.logo b{font-family:var(--f-geo);font-weight:700}
.logo small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.stats{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--muted);font-weight:600}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--clay);border-radius:14px}
.tab{border:none;background:none;border-radius:10px;padding:8px 6px;font:700 14px var(--f-ui);color:var(--muted);cursor:pointer;line-height:1.2}
.tab span{display:block;font:600 12px var(--f-geo-sans);opacity:.8}
.tab[aria-selected="true"]{background:var(--surface);color:var(--brick);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.units{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.unit{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 12px;font:600 13px var(--f-ui);cursor:pointer;text-align:left}
.unit span{display:block;font-family:var(--f-geo-sans);font-weight:400;color:var(--muted);font-size:12px;letter-spacing:.03em}
.unit[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:var(--on-brick)}
.unit[aria-pressed="true"] span{color:var(--on-brick);opacity:.8}
.unit:focus-visible,button:focus-visible,.card:focus-visible{outline:3px solid var(--brick-2);outline-offset:2px}

.bar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:8px;border-radius:99px;background:var(--clay);overflow:hidden}
.track div{height:100%;width:0;background:var(--brick);border-radius:99px;transition:width .3s}
.dir{border:none;background:none;color:var(--brick);font:700 13px var(--f-ui);cursor:pointer;padding:4px;white-space:nowrap}

.stage{perspective:1400px}
.card{position:relative;width:100%;height:clamp(400px,112vw,460px);cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.deck-forms .card{height:clamp(500px,135vw,540px)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 20px 40px;text-align:center;overflow:hidden}
.back{transform:rotateY(180deg)}
.tag{position:absolute;top:16px;left:18px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tag.r{left:auto;right:18px}
.big{font-family:var(--f-geo);font-weight:500;font-size:clamp(120px,40vw,190px);line-height:1;color:var(--brick)}
.hint{position:absolute;bottom:16px;left:0;right:0;font-size:12px;color:var(--muted)}
.sound-front{font-size:clamp(48px,14vw,72px);font-weight:800;color:var(--brick);line-height:1}
.sound-front small{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-top:10px}

.back .row{display:flex;align-items:center;gap:18px;justify-content:center}
.back .mid{font-family:var(--f-geo);font-size:76px;line-height:1;color:var(--brick)}
.back .meta{text-align:left}
.back .name{font-size:22px;font-weight:800}
.back .name em{font-style:normal;font-family:var(--f-geo-sans);font-weight:400;color:var(--muted);font-size:16px;margin-left:6px}
.back .ipa{font-size:15px;color:var(--muted)}
.back .ipa b{color:var(--fg);font-size:18px}
.note{margin-top:10px;font-size:13px;color:var(--muted);max-width:36ch}
.word{margin-top:20px;width:100%;border-top:1px dashed var(--line);padding-top:16px}
.word .w{font-family:var(--f-geo-sans);font-size:30px;font-weight:600}
.word .w mark{background:none;color:var(--brick);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.word .tr{font-size:15px;color:var(--muted);margin-top:4px}
.word .tr b{color:var(--fg);font-weight:600}
.say{margin-top:10px;border:1px solid var(--line);background:none;color:var(--brick);border-radius:999px;padding:6px 14px;font:700 13px var(--f-ui);cursor:pointer}

/* числа */
.num-big{font-weight:800;font-size:clamp(100px,32vw,160px);line-height:1;color:var(--brick);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.num-mid{font-weight:800;font-size:56px;line-height:1;color:var(--brick);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.geo-word{font-family:var(--f-geo-sans);font-weight:700;font-size:clamp(26px,8vw,38px);line-height:1.25;overflow-wrap:anywhere;max-width:100%}
.seg{display:inline}
.seg.m{color:var(--olive)}
.seg.t{color:var(--brick)}
.seg.d{color:var(--muted)}
.seg.r{color:var(--fg)}
.formula{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.formula span{padding:3px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.formula .op{border:none;background:none;padding:3px 0;color:var(--muted)}

/* формы */
.vchip{display:inline-flex;gap:8px;align-items:baseline;padding:6px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600}
.vchip b{font-family:var(--f-geo-sans);font-weight:700;color:var(--brick)}
.pron{font-family:var(--f-geo);font-size:clamp(56px,18vw,80px);line-height:1.1;color:var(--brick);margin-top:18px}
.pron-ru{font-size:20px;font-weight:800;margin-top:4px}
.pron-ru small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.ans{font-family:var(--f-geo-sans);font-weight:700;font-size:clamp(28px,8.5vw,38px);line-height:1.2}
.ans .p{color:var(--muted);font-weight:600;margin-right:8px}
.ans-tr{color:var(--muted);font-size:14px;margin-top:2px}
mark.mA{background:none;color:var(--brick);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
mark.mB{background:none;color:var(--olive);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.para{margin-top:12px;width:100%;max-width:340px;border-collapse:collapse;font-size:13px;text-align:left}
.para td{padding:3px 6px;border-bottom:1px solid var(--line)}
.para td:nth-child(1){color:var(--muted);width:58px}
.para td:nth-child(2){font-family:var(--f-geo-sans);color:var(--muted)}
.para td:nth-child(3){font-family:var(--f-geo-sans);font-weight:700;font-size:14px}
.para td:nth-child(4){color:var(--muted);font-size:12px}
.para tr.on td{background:var(--bg)}
.para tr.on td:nth-child(3){color:var(--brick)}
.ex{margin-top:12px;font-size:14px;max-width:36ch}
.ex .g{font-family:var(--f-geo-sans);font-weight:600}
.ex .r{color:var(--muted)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions button{border:none;border-radius:16px;padding:15px 10px;font:800 16px var(--f-ui);cursor:pointer;transition:transform .1s}
.actions button:active{transform:translateY(2px)}
.actions kbd{display:block;font:600 11px var(--f-ui);opacity:.65;margin-top:2px}
.no{background:var(--surface);color:var(--bad);border:2px solid var(--line)!important}
.yes{background:var(--brick);color:var(--on-brick)}
.flipbtn{grid-column:1/-1;background:var(--brick);color:var(--on-brick)}

.wall-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h2{font-size:15px;margin:0;font-weight:800}
h2 span{color:var(--muted);font-weight:600}
.legend{display:flex;gap:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.wall{display:grid;gap:4px;margin-top:10px}
.wall .b{min-width:0;height:30px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-geo-sans);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;transition:background .3s}
.deck-numbers .wall .b{height:26px;font-family:var(--f-ui);font-size:12px}
.deck-forms .wall .b{height:26px;font-size:11px;padding:0 2px}
.l0{background:var(--clay);color:var(--muted)}
.l1{background:var(--clay-2);color:var(--fg)}
.l2{background:var(--clay-3);color:var(--on-brick)}
.l3{background:var(--clinker);color:var(--on-brick)}
.b.cur{outline:2px solid var(--fg);outline-offset:1px}

details.ref{border:1px solid var(--line);border-radius:16px;background:var(--surface)}
details.ref summary{cursor:pointer;padding:14px 16px;font-weight:800;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary::after{content:"+";color:var(--brick);font-weight:800}
details.ref[open] summary::after{content:"–"}
.ref-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.ref-body p{margin:0;max-width:62ch}
.ref-body h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.rt{border-collapse:collapse;width:100%;font-size:13px}
.rt th,.rt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.rt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rt td.g{font-family:var(--f-geo-sans);font-weight:600}
.rt td.t{color:var(--muted)}
.rt td.n{font-weight:800;font-variant-numeric:tabular-nums;color:var(--brick)}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.ngrid div{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding:3px 0;min-width:0}
.ngrid b{width:28px;flex:none;text-align:right;font-variant-numeric:tabular-nums;color:var(--brick)}
.ngrid .g{font-family:var(--f-geo-sans);font-weight:600}
.ngrid .t{color:var(--muted);font-size:12px;margin-left:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);min-width:0}
.pbox h4{margin:0 0 6px;font-size:13px}
.pbox h4 b{font-family:var(--f-geo-sans);color:var(--brick);margin-right:6px}
.pbox div{display:flex;justify-content:space-between;gap:6px;font-size:13px}
.pbox div span:first-child{color:var(--muted);font-size:12px}
.pbox div span:last-child{font-family:var(--f-geo-sans);font-weight:600}

.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;min-height:340px;position:relative}
.done .big{font-size:110px}
.done p{margin:0;color:var(--muted)}
.done button{background:var(--brick);color:var(--on-brick);border:none;border-radius:14px;padding:14px 22px;font:800 15px var(--f-ui);cursor:pointer}
.foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot button{border:none;background:none;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){.card{transition:none}.track div{transition:none}}
</style>

<div class="wrap" id="app">
  <header>
    <div class="logo"><b>ანბანი</b> · анбани<small>буквы, числа и формы карточками</small></div>
    <div class="stats">
      <div class="chip" title="Опыт за всё время"><i>XP</i><span id="xp">0</span></div>
      <div class="chip" title="Верных ответов подряд"><i>серия</i><span id="streak">0</span></div>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <nav class="units" id="units" aria-label="Юниты"></nav>

  <div class="bar">
    <span id="count">1 / 10</span>
    <div class="track"><div id="prog"></div></div>
    <button class="dir" id="dir" title="Сменить направление"></button>
  </div>

  <section id="session"></section>

  <div class="actions" id="actions"></div>

  <section>
    <div class="wall-head">
      <h2 id="wallTitle"></h2>
      <div class="legend">
        <span><i class="l0"></i>глина</span><span><i class="l1"></i>сырец</span><span><i class="l2"></i>обжиг</span><span><i class="l3"></i>клинкер</span>
      </div>
    </div>
    <div class="wall" id="wall"></div>
  </section>

  <div id="ref"></div>

  <div class="foot">
    <span>Пробел — перевернуть · ← не помню · → помню</span>
    <button id="reset">Сбросить прогресс вкладки</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const strip=s=>s.replace(/[\[\]]/g,"");

/* ---------- БУКВЫ ---------- */
const LET = [
 ["ა","ани","ანი","a","как «а» в «мама»","ამინდი","amindi","погода",0],
 ["ე","эни","ენი","e","как «э» в «эхо»","ენა","ena","язык",0],
 ["ი","ини","ინი","i","как «и» в «мир»","ივლისი","ivlisi","июль",0],
 ["ო","они","ონი","o","как «о» в «дом», всегда ударное","ოთახი","otakhi","комната",0],
 ["უ","уни","უნი","u","как «у» в «утро»","უბანი","ubani","район",0],
 ["ბ","бани","ბანი","b","как «б»","ბავშვი","bavshvi","ребёнок",0],
 ["გ","гани","განი","g","как «г» в «гора»","გამარჯობა","gamarjoba","привет",0],
 ["დ","дони","დონი","d","как «д»","დედა","deda","мама",0],
 ["ვ","вини","ვინი","v","как «в», ближе к губному [w]","ვაშლი","vashli","яблоко",1],
 ["ზ","зени","ზენი","z","как «з»","ზღვა","zghva","море",1],
 ["ლ","ласи","ლასი","l","как «л», не смягчается","ლამაზი","lamazi","красивый",1],
 ["მ","мани","მანი","m","как «м»","მამა","mama","папа",1],
 ["ნ","нари","ნარი","n","как «н»","ნიორი","niori","чеснок",1],
 ["რ","раэ","რაე","r","как «р», лёгкий одноударный","რძე","rdze","молоко",1],
 ["ს","сани","სანი","s","как «с»","სახლი","sakhli","дом",1],
 ["შ","шини","შინი","sh","как «ш», мягче русского","შაქარი","shakari","сахар",1],
 ["ჟ","жани","ჟანი","zh","как «ж»","ჟურნალი","zhurnali","журнал",1],
 ["თ","тани","თანი","t","придыхательное «т», с выдохом","თბილისი","tbilisi","Тбилиси",2],
 ["ტ","т'ари","ტარი","t'","смычное «т», резкое, без выдоха","ტყე","t'q'e","лес",2],
 ["ფ","пари","ფარი","p","придыхательное «п», с выдохом","ფული","puli","деньги",2],
 ["პ","п'ари","პარი","p'","смычное «п», резкое, без выдоха","პური","p'uri","хлеб",2],
 ["ქ","кани","ქანი","k","придыхательное «к», с выдохом","ქალაქი","kalaki","город",2],
 ["კ","к'ани","კანი","k'","смычное «к», резкое, без выдоха","კატა","k'at'a","кошка",2],
 ["ყ","к'ари","ყარი","q'","глубокое горловое смычное «к»","ყველი","q'veli","сыр",2],
 ["ჩ","чини","ჩინი","ch","придыхательное «ч», твёрдое","ჩაი","chai","чай",3],
 ["ჭ","ч'ари","ჭარი","ch'","смычное «ч», резкое","ჭიქა","ch'ika","стакан",3],
 ["ც","цани","ცანი","ts","придыхательное «ц»","ცა","tsa","небо",3],
 ["წ","ц'или","წილი","ts'","смычное «ц», резкое","წყალი","ts'q'ali","вода",3],
 ["ძ","дзили","ძილი","dz","звонкое «дз» одним звуком","ძაღლი","dzaghli","собака",3],
 ["ჯ","джани","ჯანი","j","звонкое «дж» одним звуком","ჯიბე","jibe","карман",3],

function numParts(n){
  if(n===100) return {segs:[["ასი","r"]],tr:"asi",f:null};
  if(n<=20) return {segs:[[BASE[n][0],"r"]],tr:BASE[n][1],f:null};
  const k=Math.floor(n/20), r=n%20, [m,t]=TW[k];
  const segs=[]; if(m[0])segs.push([m[0],"m"]);
  if(r===0){segs.push([t[0]+"ი","t"]); return {segs,tr:m[1]+t[1]+"i",f:[k,0]}}
  segs.push([t[0],"t"],["და","d"],[BASE[r][0],"r"]);
  return {segs,tr:m[1]+t[1]+"da"+BASE[r][1],f:[k,r]};
}

  const box=v=>`<div class="pbox"><h4><b>${v.ka}</b>${v.ru.split(" (")[0]}</h4>${v.f.map((f,p)=>`<div><span>${PRON[v.cs][p][0]}</span><span>${markF(f,v.type)}</span></div>`).join("")}</div>`;
  return `<details class="ref"><summary>Как работают формы</summary><div class="ref-body">
   <p>У грузинского глагола лицо показывают приставки и окончания. Есть два набора.</p>
   <div class="scroll"><table class="rt">
    <tr><th></th><th>Тип <mark class="mA">ვ-</mark>: «я делаю»</th><th>Тип <mark class="mB">მ-</mark>: «мне …»</th></tr>
    <tr><td>я</td><td class="g"><mark class="mA">ვ</mark>‑…</td><td class="g"><mark class="mB">მ</mark>‑…</td></tr>
    <tr><td>ты</td><td class="g">—</td><td class="g"><mark class="mB">გ</mark>‑…</td></tr>
    <tr><td>он/она</td><td class="g">…‑<mark class="mA">ს</mark></td><td class="g"><mark class="mB">ჰ/ს/უ</mark>‑… или —</td></tr>
    <tr><td>мы</td><td class="g"><mark class="mA">ვ</mark>‑…‑<mark class="mA">თ</mark></td><td class="g"><mark class="mB">გვ</mark>‑…</td></tr>
    <tr><td>вы</td><td class="g">…‑<mark class="mA">თ</mark></td><td class="g"><mark class="mB">გ</mark>‑…‑<mark class="mB">თ</mark></td></tr>
    <tr><td>они</td><td class="g">…‑<mark class="mA">ენ/ან</mark></td><td class="g"><mark class="mB">ჰ/ს/უ</mark>‑…‑<mark class="mB">თ</mark></td></tr>
   </table></div>
   <p><b>Тип <span class="ka">მ-</span></b> устроен как русское «мне нравится»: тот, кто «имеет» или «хочет», стоит в дательном падеже. Поэтому «он» здесь <span class="ka">მას</span>, а «они» <span class="ka">მათ</span>, а не <span class="ka">ის / ისინი</span>.</p>
   <p><b class="ka">მყავს</b> говорят про живых (<span class="ka">ძმა მყავს</span>, «у меня есть брат»), <b class="ka">მაქვს</b> про вещи и абстрактное (<span class="ka">დრო მაქვს</span>, «у меня есть время»).</p>
   <p>У <span class="ka">ვიცი</span> «он/они» стоят в эргативе: <span class="ka">მან იცის, მათ იციან</span>.</p>
   <h3>Все таблицы</h3>
   <div class="pgrid">${VERBS.map(box).join("")}</div>
  </div></details>`;
}

/* ---------- СОСТОЯНИЕ ---------- */
const KEY="anbani-v2";
let st={xp:0,deck:"letters",box:{},unit:{letters:1,numbers:1,forms:1},rev:{}};
try{
  const s=JSON.parse(localStorage.getItem(KEY));
  if(s&&s.box) st=Object.assign(st,s);
  else{const o=JSON.parse(localStorage.getItem("anbani-v1"));if(o&&o.box&&o.box.length===33){st.box.letters=o.box;st.xp=o.xp||0;st.unit.letters=o.unit??1;st.rev.letters=!!o.rev}}
}catch(e){}
Object.keys(DECKS).forEach(d=>{if(!st.box[d]||st.box[d].length!==DECKS[d].items.length)st.box[d]=Array(DECKS[d].items.length).fill(0)});
const h=(location.hash||"").slice(1);if(DECKS[h])st.deck=h;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

let queue=[],pos=0,total=0,flipped=false,streak=0,right=0,cur=null;
const D=()=>DECKS[st.deck], BOX=()=>st.box[st.deck];
const lvl=b=>b>=4?3:b>=2?2:b>=1?1:0;

function build(){
  const pool=D().items.filter(D().units[st.unit[st.deck]].f);
  const sorted=pool.map(c=>({c,k:BOX()[c.i]+Math.random()*.9})).sort((a,b)=>a.k-b.k).map(x=>x.c);
  queue=sorted.slice(0,Math.min(D().session,pool.length));
  total=queue.length;pos=0;right=0;
  next();
}
function render(){$("front").innerHTML=D().front(cur,!!st.rev[st.deck]);$("back").innerHTML=D().back(cur);
  const s=$("say");if(s)s.onclick=e=>{e.stopPropagation();speak(D().say(cur))}}
function next(){
  if(pos>=queue.length)return finish();
  cur=queue[pos];const card=$("card");const was=card.classList.contains("flipped");
  flipped=false;card.classList.remove("flipped");
  if(was)setTimeout(render,180);else render();
  actions();ui();
}
function flip(){if(pos>=queue.length)return;flipped=!flipped;$("card").classList.toggle("flipped",flipped);actions()}
function grade(ok){
  if(!flipped||pos>=queue.length)return;
  const b=BOX(),i=cur.i;
  if(ok){b[i]=Math.min(5,b[i]+1);st.xp+=10;streak++;right++;pos++}
  else{b[i]=Math.max(0,b[i]-1);streak=0;queue.splice(Math.min(queue.length,pos+4),0,cur);pos++;total++}
  save();next();
}
function actions(){
  const a=$("actions");
  if(pos>=queue.length){a.innerHTML="";return}
  a.innerHTML=flipped
   ?`<button class="no" id="bn">Не помню<kbd>←</kbd></button><button class="yes" id="by">Помню<kbd>→</kbd></button>`
   :`<button class="flipbtn" id="bf">Показать ответ<kbd>пробел</kbd></button>`;
  if(flipped){$("bn").onclick=()=>grade(false);$("by").onclick=()=>grade(true)}else $("bf").onclick=flip;
}
function finish(){
  $("session").innerHTML=`<div class="face done"><div class="big">ჰო!</div><p><b style="color:var(--fg)">ho!</b> («да!») Круг пройден: ${right} карточек, повторов после ошибки ${total-right}.</p><button id="again">Ещё круг</button></div>`;
  $("actions").innerHTML="";$("again").onclick=restart;ui();
}
function restart(){
  $("session").innerHTML=`<div class="stage"><div class="card" id="card" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="face front" id="front"></div><div class="face back" id="back"></div></div></div>`;
  $("card").onclick=flip;$("card").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();flip()}};
  $("app").className="wrap deck-"+st.deck;
  $("ref").innerHTML=D().ref();
  build();
}
function ui(){
  const d=D();
  $("xp").textContent=st.xp;$("streak").textContent=streak;
  const done=Math.min(pos,queue.length);
  $("count").textContent=`${Math.min(done+1,queue.length)} / ${queue.length}`;
  $("prog").style.width=(queue.length?done/queue.length*100:0)+"%";
  $("dir").textContent=d.dir[st.rev[st.deck]?1:0];
  $("tabs").innerHTML=Object.entries(DECKS).map(([k,v])=>`<button class="tab" role="tab" aria-selected="${k===st.deck}" data-d="${k}">${v.tab}<span>${v.tabKa}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(st.deck===b.dataset.d)return;st.deck=b.dataset.d;streak=0;save();try{history.replaceState(null,"","#"+st.deck)}catch(e){}restart();window.scrollTo({top:0})});
  $("units").innerHTML=d.units.map((u,k)=>`<button class="unit" aria-pressed="${k===st.unit[st.deck]}" data-k="${k}">${u.t}<span>${u.sub}</span></button>`).join("");
  $("units").querySelectorAll(".unit").forEach(b=>b.onclick=()=>{st.unit[st.deck]=+b.dataset.k;save();restart()});
  const box=BOX(),live=pos<queue.length&&cur;
  $("wall").style.gridTemplateColumns=`repeat(${d.cols},minmax(0,1fr))`;
  $("wall").innerHTML=d.items.map(c=>`<div class="b l${lvl(box[c.i])}${live&&cur.i===c.i?" cur":""}" title="${d.tip(c)}">${d.label(c)}</div>`).join("");
  $("wallTitle").innerHTML=`${d.wall} <span>· клинкер ${box.filter(b=>b>=4).length} из ${d.items.length}</span>`;
}

/* озвучка — только если в системе есть грузинский голос */
let voice=null;
const sayBtn=()=>voice?`<button class="say" id="say">▶ послушать</button>`:"";
function pickVoice(){try{voice=speechSynthesis.getVoices().find(v=>/^ka/i.test(v.lang))||null}catch(e){voice=null}}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.voice=voice;u.lang="ka-GE";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();if(cur&&pos<queue.length)render()}}

$("dir").onclick=()=>{st.rev[st.deck]=!st.rev[st.deck];save();restart()};
$("reset").onclick=e=>{
  const b=e.target;
  if(b.dataset.c){st.box[st.deck]=Array(D().items.length).fill(0);save();b.textContent="Сбросить прогресс вкладки";delete b.dataset.c;restart()}
  else{b.dataset.c=1;b.textContent="Точно сбросить? Нажмите ещё раз"}
};
document.addEventListener("keydown",e=>{
  const onBtn=e.target.closest&&e.target.closest("button,summary");
  if(e.code==="Space"&&!onBtn){e.preventDefault();flip()}
  else if(e.key==="ArrowLeft"||e.key==="1")grade(false);
  else if(e.key==="ArrowRight"||e.key==="2")grade(true);
});
restart();
</script>
